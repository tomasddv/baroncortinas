name: Cotizador interno
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: baron_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: node --check static/internal.js
      - run: node --check static/settings.js
      - run: node --check static/inventory.js
      - run: node --check static/users.js
      - run: node --check static/operational.js
      - run: python -m pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:test@localhost:5432/baron_test
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/browser_upgrade.py
      - run: python tests/browser_operational.py
      - uses: actions/upload-artifact@v4
        with:
          name: capturas-responsive
          path: work/browser-evidence/*.png
